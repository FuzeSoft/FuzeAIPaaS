apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: fuze-postgres
  namespace: fuze-ai-paas
  labels:
    app: fuze-postgres
spec:
  serviceName: fuze-postgres
  replicas: 1
  selector:
    matchLabels:
      app: fuze-postgres
  template:
    metadata:
      labels:
        app: fuze-postgres
    spec:
      # postgres 官方镜像以 UID 999（postgres 用户）运行；显式声明并以 fsGroup
      # 保证 PVC 可写。禁止以 root 启动（安全基线）。
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        allowPrivilegeEscalation: false
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: postgres
        image: postgres:16-alpine
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        ports:
        - containerPort: 5432
          name: postgres
        env:
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: fuze-backend-secrets
              key: POSTGRES_DB
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: fuze-backend-secrets
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: fuze-backend-secrets
              key: POSTGRES_PASSWORD
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "1"
            memory: "1Gi"
        livenessProbe:
          exec:
            command: ["pg_isready", "-U", "$(POSTGRES_USER)", "-d", "$(POSTGRES_DB)"]
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "$(POSTGRES_USER)", "-d", "$(POSTGRES_DB)"]
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: pgdata
          mountPath: /var/lib/postgresql/data
  # 单副本有状态服务，数据持久化于 PVC 模板。生产如需高可用请改用托管 PG 或 Patroni。
  volumeClaimTemplates:
  - metadata:
      name: pgdata
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 10Gi
