# 后端与 Postgres 共享的密钥。
# 注意：下方为示例占位值，禁止直接用于生产。实际部署请通过 CI/外部 secret 管理注入。
# 至少覆盖：DB_DSN、POSTGRES_PASSWORD、ADMIN_PASSWORD。
# DB_DSN 中 host 使用 Postgres Service 名 fuze-postgres（同命名空间内可解析）。
apiVersion: v1
kind: Secret
metadata:
  name: fuze-backend-secrets
  namespace: fuze-ai-paas
  labels:
    app: fuze-backend
type: Opaque
stringData:
  DB_DSN: "postgres://fuze:fuze@fuze-postgres:5432/fuze?sslmode=disable"
  POSTGRES_DB: "fuze"
  POSTGRES_USER: "fuze"
  POSTGRES_PASSWORD: "fuze-change-me"
  ADMIN_PASSWORD: "change-me-strong"
  GRAFANA_ADMIN_PASSWORD: "grafana-change-me"
