[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fuze-ml"
version = "0.1.0"
description = "Fuze AI PaaS training & experiment-tracking SDK (zero third-party dependencies)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Proprietary" }

[tool.setuptools.packages.find]
where = ["."]
include = ["fuze_ml*"]
